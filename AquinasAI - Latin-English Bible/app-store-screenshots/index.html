<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquinasAI — App Store Screenshots</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cormorant Garamond',Baskerville,Georgia,serif;
  background:linear-gradient(168deg,#1d1024,#2e1a3b 50%,#190e21);
  color:#F2EEE4;min-height:100vh;padding:60px 24px 80px;text-align:center;
}
h1{font-size:clamp(38px,6vw,72px);font-weight:600}
h1 em{font-style:italic;color:#E6C66E}
.sub{color:rgba(242,238,228,.6);font-style:italic;font-size:20px;margin:14px 0 8px}
.note{color:rgba(242,238,228,.4);font-size:15px;margin-bottom:48px}
.note code{color:#E6C66E;font-family:ui-monospace,monospace;font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;max-width:1400px;margin:0 auto}
figure{width:260px}
img{width:100%;border-radius:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 0 0 1px rgba(201,162,75,.2);display:block}
figcaption{margin-top:14px;font-size:17px;color:rgba(242,238,228,.7);font-style:italic}
</style>
</head>
<body>
  <h1>App Store <em>Screenshots</em></h1>
  <div class="sub">AquinasAI — Latin · English · Español Bible &amp; Rosary</div>
  <div class="note">Six slides · 1290×2796 (iPhone 6.7″) · ready to upload from <code>out/</code></div>
  <div class="grid">
    <figure><img src="out/01-today.png"><figcaption>1 · Daily rhythm</figcaption></figure>
    <figure><img src="out/02-rosary-listen.png"><figcaption>2 · Rosary, read aloud</figcaption></figure>
    <figure><img src="out/03-bible-parallel.png"><figcaption>3 · Parallel Scripture</figcaption></figure>
    <figure><img src="out/04-prayers.png"><figcaption>4 · Prayer library</figcaption></figure>
    <figure><img src="out/05-speed-reader.png"><figcaption>5 · Speed reader</figcaption></figure>
    <figure><img src="out/06-light-dark.png"><figcaption>6 · Light &amp; dark</figcaption></figure>
  </div>
</body>
</html>
